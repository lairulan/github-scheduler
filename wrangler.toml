name = "github-scheduler"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = [
  "30 0 * * *",
  "5 12 * * *",
  "0 4 * * *",
  "0 12 * * *"
]

# 30 0 * * *  = UTC 00:30 = 北京时间 08:30 (daily-tech-news)
# 5 12 * * *  = UTC 12:05 = 北京时间 20:05 (daily-robot-insights)
# 0 4 * * *   = UTC 04:00 = 北京时间 12:00 (skill-digest)
# 0 12 * * *  = UTC 12:00 = 北京时间 20:00 (daily-beauty)
