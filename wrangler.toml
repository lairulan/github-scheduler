name = "github-scheduler"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = [
  "0 17 * * *",
  "0 1 * * *",
  "0 2 * * *",
  "0 12 * * *"
]

# 4 cron triggers（免费版上限 5 个）
# 0 17 * * *  = UTC 17:00 = 北京 01:00  → sub2api-daily-report
# 0 1 * * *   = UTC 01:00 = 北京 09:00  → daily-tech-news + health-wellness（合并，原 08:30+09:00）
# 0 2 * * *   = UTC 02:00 = 北京 10:00  → daily-ai-briefing
# 0 12 * * *  = UTC 12:00 = 北京 20:00  → beauty + robot-insights(周一三五) + psychology（合并，原 19:30+20:00）
# Telegram 日报 → GitHub Actions (.github/workflows/daily-report.yml)
