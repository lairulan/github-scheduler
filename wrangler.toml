name = "github-scheduler"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = [
  "30 0 * * *",
  "0 1 */2 * *",
  "0 4 * * *",
  "30 11 * * *",
  "0 12 * * *"
]

# 30 0 * * *   = UTC 00:30 = 北京时间 08:30 (daily-tech-news)
# 0 1 */2 * *  = UTC 01:00 = 北京时间 09:00 隔天发布 (health-wellness-publisher)
# 0 4 * * *    = UTC 04:00 = 北京时间 12:00 (skill-digest)
# 30 11 * * *  = UTC 11:30 = 北京时间 19:30 (beauty-generator)
# 0 12 * * *   = UTC 12:00 = 北京时间 20:00 (industrial-robot-insights 周一三五 + teen-psychology-insights 每天)
