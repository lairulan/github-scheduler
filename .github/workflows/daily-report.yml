name: Daily Skill Status Report

on:
  schedule:
    - cron: '0 14 * * *'  # UTC 14:00 = 北京时间 22:00
  workflow_dispatch:        # 支持手动触发

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check all skill workflows and send Telegram report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          #!/bin/bash
          set -euo pipefail

          # 北京时间
          BJT_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d')
          BJT_TIME=$(TZ=Asia/Shanghai date '+%H:%M')
          BJT_WEEKDAY=$(TZ=Asia/Shanghai date '+%u')  # 1=Mon ... 7=Sun

          WEEKDAY_NAMES=("" "一" "二" "三" "四" "五" "六" "日")
          WEEKDAY_NAME=${WEEKDAY_NAMES[$BJT_WEEKDAY]}

          # 定义所有需要检查的 skill 仓库
          declare -A REPOS
          REPOS=(
            ["Sub2API 运营报告"]="lairulan/sub2api-daily-report"
            ["每日科技新闻"]="lairulan/daily-tech-news"
            ["手工暖食小馆"]="lairulan/health-wellness-publisher"
            ["天合虹蕴康养"]="lairulan/tianhe-wellness-publisher"
            ["AI大事件日报"]="lairulan/daily-ai-briefing"
            ["Skill 精选"]="lairulan/skill-digest"
            ["每日艺术写真"]="lairulan/beauty-generator"
            ["工业机器人洞察"]="lairulan/industrial-robot-insights"
            ["心光馨语"]="lairulan/teen-psychology-insights"
            ["Web3 每日洞察"]="lairulan/web3-daily"
          )

          # 按运行时间排序的 key 列表
          ORDERED_KEYS=(
            "Sub2API 运营报告"
            "每日科技新闻"
            "手工暖食小馆"
            "天合虹蕴康养"
            "AI大事件日报"
            "Skill 精选"
            "Web3 每日洞察"
            "心光馨语"
            "每日艺术写真"
            "工业机器人洞察"
          )

          SUCCESS=0
          FAIL=0
          SKIP=0
          TOTAL=${#ORDERED_KEYS[@]}
          DETAILS=""

          for NAME in "${ORDERED_KEYS[@]}"; do
            REPO="${REPOS[$NAME]}"

            # 查询最近 24 小时的 workflow runs
            RUNS=$(gh api "repos/${REPO}/actions/runs?per_page=3&created=>=${BJT_DATE}" \
              --jq '.workflow_runs[:1] | .[] | "\(.status)|\(.conclusion // "null")|\(.run_started_at // "")|\(.updated_at // "")|\(.html_url)"' \
              2>/dev/null || echo "")

            if [ -z "$RUNS" ]; then
              # 没有今天的运行记录，尝试查最近一次
              RUNS=$(gh api "repos/${REPO}/actions/runs?per_page=1" \
                --jq '.workflow_runs[:1] | .[] | "\(.status)|\(.conclusion // "null")|\(.run_started_at // "")|\(.updated_at // "")|\(.html_url)"' \
                2>/dev/null || echo "ERROR")

              if [ "$RUNS" = "ERROR" ] || [ -z "$RUNS" ]; then
                DETAILS="${DETAILS}[??] <b>${NAME}</b> - API 查询失败\n"
                FAIL=$((FAIL + 1))
                continue
              fi

              # 检查最近一次是否在今天
              LAST_DATE=$(echo "$RUNS" | cut -d'|' -f3 | cut -d'T' -f1)
              if [ "$LAST_DATE" != "$BJT_DATE" ]; then
                DETAILS="${DETAILS}[--] <b>${NAME}</b> - 今日未运行\n"
                SKIP=$((SKIP + 1))
                continue
              fi
            fi

            STATUS=$(echo "$RUNS" | cut -d'|' -f1)
            CONCLUSION=$(echo "$RUNS" | cut -d'|' -f2)
            STARTED=$(echo "$RUNS" | cut -d'|' -f3)
            UPDATED=$(echo "$RUNS" | cut -d'|' -f4)

            # 计算运行时长
            DURATION=""
            if [ -n "$STARTED" ] && [ -n "$UPDATED" ]; then
              START_TS=$(date -d "$STARTED" +%s 2>/dev/null || echo "0")
              END_TS=$(date -d "$UPDATED" +%s 2>/dev/null || echo "0")
              if [ "$START_TS" != "0" ] && [ "$END_TS" != "0" ]; then
                MINS=$(( (END_TS - START_TS) / 60 ))
                if [ $MINS -lt 60 ]; then
                  DURATION=" (${MINS}min)"
                else
                  HOURS=$((MINS / 60))
                  RMINS=$((MINS % 60))
                  DURATION=" (${HOURS}h${RMINS}m)"
                fi
              fi
            fi

            if [ "$STATUS" = "completed" ]; then
              case "$CONCLUSION" in
                success)
                  DETAILS="${DETAILS}[OK] <b>${NAME}</b>${DURATION}\n"
                  SUCCESS=$((SUCCESS + 1))
                  ;;
                skipped)
                  DETAILS="${DETAILS}[--] <b>${NAME}</b>${DURATION} - 已跳过\n"
                  SKIP=$((SKIP + 1))
                  ;;
                *)
                  DETAILS="${DETAILS}[!!] <b>${NAME}</b>${DURATION} - ${CONCLUSION}\n"
                  FAIL=$((FAIL + 1))
                  ;;
              esac
            elif [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ]; then
              DETAILS="${DETAILS}[..] <b>${NAME}</b> - 运行中\n"
            else
              DETAILS="${DETAILS}[??] <b>${NAME}</b> - ${STATUS}\n"
              FAIL=$((FAIL + 1))
            fi
          done

          # 构建消息
          if [ $FAIL -eq 0 ]; then
            STATUS_LINE="ALL PASS"
          else
            STATUS_LINE="${FAIL} FAILED"
          fi

          MESSAGE="<b>Skill 定时任务日报</b>
          <code>${BJT_DATE} 周${WEEKDAY_NAME}</code> | ${STATUS_LINE}

          ━━ <b>运行概览</b> ━━━━━━━━━━
          成功: <b>${SUCCESS}</b> | 失败: <b>${FAIL}</b> | 跳过: <b>${SKIP}</b> | 总计: ${TOTAL}

          ━━ <b>详细状态</b> ━━━━━━━━━━
          $(echo -e "$DETAILS")
          <i>${BJT_TIME} CST | github-scheduler</i>"

          # 去掉多余缩进
          MESSAGE=$(echo "$MESSAGE" | sed 's/^          //')

          # 发送到 Telegram
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TG_CHAT_ID}\",
              \"text\": $(echo "$MESSAGE" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))"),
              \"parse_mode\": \"HTML\",
              \"disable_web_page_preview\": true
            }")

          echo "Telegram response: $RESPONSE"

          # 检查是否发送成功
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('ok', False))" 2>/dev/null || echo "False")
          if [ "$OK" = "True" ]; then
            echo "Report sent successfully!"
          else
            echo "Failed to send report!"
            exit 1
          fi
