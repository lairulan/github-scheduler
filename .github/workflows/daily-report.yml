name: Daily Skill Status Report

on:
  schedule:
    - cron: '0 14 * * *'  # UTC 14:00 = 北京时间 22:00
  workflow_dispatch:        # 支持手动触发

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check all skill workflows and send Telegram report
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          #!/bin/bash
          set -euo pipefail

          BJT_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d')
          BJT_TIME=$(TZ=Asia/Shanghai date '+%H:%M')
          BJT_WEEKDAY=$(TZ=Asia/Shanghai date '+%u')
          WEEKDAY_NAMES=("" "一" "二" "三" "四" "五" "六" "日")
          WEEKDAY_NAME=${WEEKDAY_NAMES[$BJT_WEEKDAY]}

          # 按执行时间排序的 skill 列表
          SKILLS=(
            "Sub2API 运营报告|lairulan/sub2api-daily-report"
            "每日科技新闻|lairulan/daily-tech-news"
            "手工暖食小馆|lairulan/health-wellness-publisher"
            "天合虹蕴康养|lairulan/tianhe-wellness-publisher"
            "AI大事件日报|lairulan/daily-ai-briefing"
            "Web3 每日洞察|lairulan/web3-daily"
            "心光馨语|lairulan/teen-psychology-insights"
            "每日艺术写真·文生图|lairulan/beauty-generator"
            "每日艺术写真·图生图|lairulan/beauty-img2img"
            "工业机器人洞察|lairulan/industrial-robot-insights"
          )

          SUCCESS=0
          FAIL=0
          SKIP=0
          TOTAL=${#SKILLS[@]}
          DETAILS=""

          for SKILL in "${SKILLS[@]}"; do
            NAME="${SKILL%%|*}"
            REPO="${SKILL##*|}"

            API_RESULT=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/actions/runs?per_page=3&created=>=${BJT_DATE}" 2>/dev/null)

            RUN_INFO=$(echo "$API_RESULT" | python3 -c "
          import sys, json
          try:
              d = json.loads(sys.stdin.read())
              if 'message' in d:
                  print(f'ERROR|{d[\"message\"]}')
              else:
                  runs = d.get('workflow_runs', [])
                  if not runs:
                      print('NO_RUNS|')
                  else:
                      r = runs[0]
                      status = r.get('status', '')
                      conclusion = r.get('conclusion', '') or ''
                      started = r.get('run_started_at', '') or ''
                      updated = r.get('updated_at', '') or ''
                      # calc duration
                      dur = ''
                      if started and updated:
                          from datetime import datetime
                          s = datetime.fromisoformat(started.replace('Z','+00:00'))
                          e = datetime.fromisoformat(updated.replace('Z','+00:00'))
                          mins = int((e - s).total_seconds() / 60)
                          dur = f'{mins}min' if mins < 60 else f'{mins//60}h{mins%60}m'
                      print(f'{status}|{conclusion}|{dur}')
          except Exception as ex:
              print(f'ERROR|{ex}')
          " 2>/dev/null)

            TYPE=$(echo "$RUN_INFO" | cut -d'|' -f1)
            FIELD2=$(echo "$RUN_INFO" | cut -d'|' -f2)
            FIELD3=$(echo "$RUN_INFO" | cut -d'|' -f3)

            case "$TYPE" in
              ERROR)
                DETAILS="${DETAILS}[!!] <b>${NAME}</b> - ${FIELD2}\n"
                FAIL=$((FAIL + 1))
                ;;
              NO_RUNS)
                DETAILS="${DETAILS}[--] <b>${NAME}</b> - 今日未运行\n"
                SKIP=$((SKIP + 1))
                ;;
              completed)
                DUR_STR=""
                [ -n "$FIELD3" ] && DUR_STR=" (${FIELD3})"
                case "$FIELD2" in
                  success)
                    DETAILS="${DETAILS}[OK] <b>${NAME}</b>${DUR_STR}\n"
                    SUCCESS=$((SUCCESS + 1))
                    ;;
                  skipped)
                    DETAILS="${DETAILS}[--] <b>${NAME}</b>${DUR_STR} - 已跳过\n"
                    SKIP=$((SKIP + 1))
                    ;;
                  *)
                    DETAILS="${DETAILS}[!!] <b>${NAME}</b>${DUR_STR} - ${FIELD2}\n"
                    FAIL=$((FAIL + 1))
                    ;;
                esac
                ;;
              in_progress|queued)
                DETAILS="${DETAILS}[..] <b>${NAME}</b> - 运行中\n"
                ;;
              *)
                DETAILS="${DETAILS}[??] <b>${NAME}</b> - ${TYPE}\n"
                FAIL=$((FAIL + 1))
                ;;
            esac
          done

          if [ $FAIL -eq 0 ]; then
            STATUS_LINE="ALL PASS"
          else
            STATUS_LINE="${FAIL} FAILED"
          fi

          MESSAGE="<b>Skill 定时任务日报</b>
          <code>${BJT_DATE} 周${WEEKDAY_NAME}</code> | ${STATUS_LINE}

          ━━ <b>运行概览</b> ━━━━━━━━━━
          成功: <b>${SUCCESS}</b> | 失败: <b>${FAIL}</b> | 跳过: <b>${SKIP}</b> | 总计: ${TOTAL}

          ━━ <b>详细状态</b> ━━━━━━━━━━
          $(echo -e "$DETAILS")
          <i>${BJT_TIME} CST | github-scheduler</i>"

          MESSAGE=$(echo "$MESSAGE" | sed 's/^          //')

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TG_CHAT_ID}\",
              \"text\": $(echo "$MESSAGE" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))"),
              \"parse_mode\": \"HTML\",
              \"disable_web_page_preview\": true
            }")

          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('ok', False))" 2>/dev/null || echo "False")
          if [ "$OK" = "True" ]; then
            echo "Report sent successfully!"
          else
            echo "Failed: $RESPONSE"
            exit 1
          fi
